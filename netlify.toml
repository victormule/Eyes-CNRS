# ============================================================================
# CONFIG NETLIFY — équivalent du .htaccess pour la prod Netlify
# (le canonical pointe vers soleyman.netlify.app)
# Place ce fichier à la racine du repo, à côté du index.html.
# ============================================================================

[build]
  publish = "."

# ──────────────────────────────────────────────────────────────────────
# Headers : cache + sécurité + bfcache-friendly
# ──────────────────────────────────────────────────────────────────────

# HTML : revalider à chaque visite, MAIS pas de "no-store" (bfcache OK)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Page racine
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

# Images : cache long (assets versionnés via le suffixe -800/-1200)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Médias : cache long
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Note : Netlify active automatiquement la compression Brotli/gzip pour
# text/html, text/css, application/javascript — rien à configurer.
